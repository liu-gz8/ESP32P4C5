## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  # 摄像头:SCCB/传感器驱动
  espressif/esp_cam_sensor: ^2.1.0
  # 行人检测模型(esp-dl 生态,输入 224x224x3,int8 量化,模型 435KB)
  espressif/pedestrian_detect: '*'
  # 视频通路:提供 /dev/video0 的 V4L2 接口。
  # 注意不要锁成厂商用的 0.8.* —— 那个版本面向 IDF 6.0,
  # 用了 6.1 已删除的 CAM_CTLR_COLOR_YUV422 枚举。放开约束会解析到
  # esp_video 2.5.x(已在 IDF 6.1 上验证可编译可运行)。
  espressif/esp_video: '*'
  espressif/esp_painter: '*'
